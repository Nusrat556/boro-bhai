<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BORO BHAI</title>
    <meta name="description" content="BORO BHAI is a local AI assistant for research, job analysis, skill gap checks, and document understanding." />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-mark">B</div>
          <div class="brand-copy">
            <div class="brand-name">BORO BHAI</div>
            <div class="brand-tag">AI workspace</div>
          </div>
        </div>

        <button id="new-chat" class="new-chat-button" type="button">+ New Chat</button>

        <div class="sidebar-section">
          <div class="section-label">Recent</div>
          <div id="conversation-list" class="conversation-list">
            <button class="conversation-item active" type="button">Current conversation</button>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-label">Quick tools</div>
          <div class="tool-grid">
            <button class="tool-button" type="button" data-prompt="Research the latest AI agent trends">Research</button>
            <button class="tool-button" type="button" data-prompt="Analyze this job description and compare it to my skills">Analyze Job</button>
            <button class="tool-button" type="button" data-prompt="Check my skills against a product manager role">Skill Gap</button>
            <button class="tool-button" type="button" data-prompt="Upload a document and summarize it">Upload</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="brand-mini">BORO BHAI</div>
          <div class="top-actions">
            <button id="open-home" class="icon-button" type="button">Home</button>
            <button id="clear-history" class="icon-button muted" type="button">Clear</button>
          </div>
        </header>

        <section id="home-view" class="home-view">
          <div class="hero-block">
            <div class="eyebrow">Your personal AI agent</div>
            <h1>BORO BHAI</h1>
            <p>Ask anything, investigate deeply, and turn raw context into useful next steps.</p>
          </div>

          <div class="composer-shell">
            <form id="chat-form" class="chat-form">
              <div class="composer-field">
                <textarea id="chat-input" rows="1" placeholder="Message BORO BHAI..." autocomplete="off"></textarea>
                <button type="submit" class="send-button" aria-label="Send message">↑</button>
              </div>

              <div class="composer-toolbar">
                <div class="quick-actions">
                  <button type="button" class="mini-action" data-prompt="Research the latest AI agent trends">Research</button>
                  <button type="button" class="mini-action" data-prompt="Analyze this job description and compare it to my skills">Analyze Job</button>
                  <button type="button" class="mini-action" data-prompt="Check my skills against a software engineering role">Skill Gap</button>
                  <button type="button" class="mini-action" data-prompt="Summarize the uploaded document">Upload</button>
                </div>
              </div>
            </form>
          </div>

          <div id="chat-status" class="status" aria-live="polite"></div>
        </section>

        <section id="chat-view" class="chat-view" aria-live="polite">
          <div class="chat-window">
            <div class="chat-header-row">
              <div class="chat-indicator"><span></span> Live chat</div>
            </div>
            <div id="chat-output" class="chat-output"></div>
          </div>
        </section>

        <div class="tool-panel-grid">
          <section class="utility-panel" aria-label="Research tool">
            <div class="utility-header">
              <span class="utility-label">Research</span>
              <span class="utility-dot"></span>
            </div>
            <form id="research-form" class="compact-form">
              <input id="research-query" type="text" placeholder="Search for current information" />
              <button type="submit" class="soft-button">Run</button>
            </form>
            <div id="research-output" class="result-box"></div>
          </section>

          <section class="utility-panel" aria-label="Upload tool">
            <div class="utility-header">
              <span class="utility-label">Upload</span>
              <span class="utility-dot"></span>
            </div>
            <form id="upload-form" class="compact-form">
              <label class="dropzone" for="upload-file">
                <span>Drop a file here</span>
                <small>.txt .csv .pdf</small>
              </label>
              <input id="upload-file" type="file" accept=".txt,.csv,.pdf" />
              <button type="submit" class="soft-button">Upload</button>
            </form>
            <div id="upload-output" class="result-box"></div>
          </section>
        </div>

        <div class="tool-panel-grid">
          <section class="utility-panel" aria-label="Career analysis tool">
            <div class="utility-header">
              <span class="utility-label">Analyze job</span>
              <span class="utility-dot"></span>
            </div>
            <form id="job-form" class="compact-form">
              <textarea id="job-text" rows="4" placeholder="Paste the job description..."></textarea>
              <input id="user-skills" type="text" placeholder="Your skills (comma separated)" />
              <button type="submit" class="soft-button">Analyze</button>
            </form>
            <div id="job-output" class="result-box"></div>
          </section>

          <section class="utility-panel" aria-label="Skill gap tool">
            <div class="utility-header">
              <span class="utility-label">Skill gap</span>
              <span class="utility-dot"></span>
            </div>
            <form id="skill-gap-form" class="compact-form">
              <textarea id="skill-gap-text" rows="4" placeholder="Paste the role description..."></textarea>
              <input id="skill-gap-skills" type="text" placeholder="Current skills (comma separated)" />
              <button type="submit" class="soft-button">Check</button>
            </form>
            <div id="skill-gap-output" class="result-box"></div>
          </section>
        </div>

        <section class="report-panel utility-panel" aria-label="Reports tool">
          <div class="utility-header">
            <span class="utility-label">Reports</span>
            <span class="utility-dot"></span>
          </div>
          <button id="load-reports" class="soft-button full-width" type="button">Load reports</button>
          <div id="reports-output" class="result-box"></div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
